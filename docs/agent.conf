<!--
  Configuración centralizada: el manager la envía a todos los agentes del grupo "default".
  Proyecto Final Seguridad Informática UNA 2026
-->

<!-- FIM para agentes Linux (agent-linux y agent-db) -->
<agent_config os="Linux">
  <syscheck>
    <!-- /etc/passwd y /etc/sudoers en tiempo real (T1548.003, Control CIS 3) -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <!-- Binarios del sistema -->
    <directories check_all="yes" realtime="yes">/bin,/usr/bin</directories>
    <!-- Sitio web: detecta webshells o defacement en el servidor Apache -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/var/www</directories>
  </syscheck>
</agent_config>

<!-- FIM para agent-windows -->
<agent_config os="Windows">
  <syscheck>
    <!-- System32 y un nivel de subcarpetas (incluye drivers, relevante para T1068).
         recursion_level=1 evita escanear decenas de miles de archivos. -->
    <directories check_all="yes" realtime="yes" recursion_level="1">C:\Windows\System32</directories>
  </syscheck>
</agent_config>

<!-- Logs de Apache en agent-linux: base del decoder y la detección de SQLi (T1190) -->
<agent_config name="agent-linux">
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/error.log</location>
  </localfile>
</agent_config>

<!-- Logs de PostgreSQL en agent-db: autenticaciones fallidas y consultas sospechosas.
     El comodin en el nombre cubre cualquier version mayor de PostgreSQL
     (Debian 12 trae la 15), asi no depende de confirmar la version. -->
<agent_config name="agent-db">
  <localfile>
    <log_format>postgresql_log</log_format>
    <location>/var/log/postgresql/postgresql-*-main.log</location>
  </localfile>
</agent_config>

