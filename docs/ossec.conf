<!--
  Wazuh - Manager - Default configuration for ubuntu 22.04
  More info at: https://documentation.wazuh.com
  Mailing list: https://groups.google.com/forum/#!forum/wazuh
-->

<ossec_config>
<!--
  ossec.conf del wazuh-server (192.168.100.10)
  Proyecto Final Seguridad Informática UNA 2026
  Configura: FIM (syscheck), rootcheck, logcollector y Active Response.
  El FIM de los agentes se define aparte en /var/ossec/etc/shared/default/agent.conf
-->

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>smtp.example.wazuh.com</smtp_server>
    <email_from>wazuh@example.wazuh.com</email_from>
    <email_to>recipient@example.wazuh.com</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>yes</update_check>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- Choose between "plain", "json", or "plain,json" for the format of internal logs -->
  <logging>
    <log_format>plain</log_format>
  </logging>

  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- Policy monitoring -->
  <!-- 
  Rootcheck: busca rootkits, troyanos, procesos y puertos ocultos
  e interfaces en modo promiscuo (Control CIS 10). Corre cada 12 h. 
  -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>

    <!-- Frequency that rootcheck is executed - every 12 hours -->
    <frequency>43200</frequency>

    <rootkit_files>etc/rootcheck/rootkit_files.txt</rootkit_files>
    <rootkit_trojans>etc/rootcheck/rootkit_trojans.txt</rootkit_trojans>

    <skip_nfs>yes</skip_nfs>

    <ignore>/var/lib/containerd</ignore>
    <ignore>/var/lib/docker/overlay2</ignore>
  </rootcheck>

  <wodle name="cis-cat">
    <disabled>yes</disabled>
    <timeout>1800</timeout>
    <interval>1d</interval>
    <scan-on-start>yes</scan-on-start>

    <java_path>wodles/java</java_path>
    <ciscat_path>wodles/ciscat</ciscat_path>
  </wodle>

  <!-- Osquery integration -->
  <wodle name="osquery">
    <disabled>yes</disabled>
    <run_daemon>yes</run_daemon>
    <log_path>/var/log/osquery/osqueryd.results.log</log_path>
    <config_path>/etc/osquery/osquery.conf</config_path>
    <add_labels>yes</add_labels>
  </wodle>

  <!-- System inventory -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>

    <!-- Database synchronization settings -->
    <synchronization>
      <max_eps>10</max_eps>
    </synchronization>
  </wodle>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>

  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <indexer>
    <enabled>yes</enabled>
    <hosts>
      <host>https://127.0.0.1:9200</host>
    </hosts>
    <ssl>
      <certificate_authorities>
        <ca>/etc/filebeat/certs/root-ca.pem</ca>
      </certificate_authorities>
      <certificate>/etc/filebeat/certs/wazuh-server.pem</certificate>
      <key>/etc/filebeat/certs/wazuh-server-key.pem</key>
    </ssl>
  </indexer>

  <!-- File integrity monitoring -->
  <syscheck>
    <disabled>no</disabled>

    <!--
    Escaneo completo cada 12 horas 
    -->
    <frequency>43200</frequency>

    <scan_on_start>yes</scan_on_start>

    <!-- Generate alert when new file detected -->
    <alert_new_files>yes</alert_new_files>

    <!-- Don't ignore files that change more than 'frequency' times -->
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!--
    FIM: vigila los directorios críticos del manager.
    check_all = revisa hash, permisos, dueño y tamaño.
    realtime = alerta al instante en vez de esperar el escaneo de 12 h. 
    -->

    <!--
    /etc en tiempo real: detecta cambios en /etc/passwd y /etc/sudoers
    (T1548.003, Control CIS 3). report_changes guarda qué línea cambió.
    -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>

    <!-- 
    Binarios del sistema: detecta reemplazo de ejecutables (troyanos).
    En Ubuntu 22.04 /bin es un enlace a /usr/bin; se listan ambos por la política. 
    -->
    <directories check_all="yes" realtime="yes">/bin,/usr/bin</directories>

    <!-- Resto de directorios del sistema: escaneo programado normal -->
    <directories check_all="yes">/sbin,/usr/sbin,/boot</directories>

    <!--
    Directorio de pruebas de la integración con VirusTotal (Paso 1.10).
    Se usa un directorio propio y no /etc porque la API gratuita de VirusTotal
    admite 4 consultas por minuto: apuntarla a un directorio que cambia mucho
    agotaría la cuota y dejaría alertas sin analizar.
    -->
    <directories check_all="yes" realtime="yes">/opt/vt-test</directories>

    <!-- Files/directories to ignore -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>

    <!-- File types to ignore -->
    <ignore type="sregex">.log$|.swp$</ignore>

    <!-- Check the file, but never compute the diff -->
    <nodiff>/etc/ssl/private.key</nodiff>

    <skip_nfs>yes</skip_nfs>
    <skip_dev>yes</skip_dev>
    <skip_proc>yes</skip_proc>
    <skip_sys>yes</skip_sys>

    <!-- Nice value for Syscheck process -->
    <process_priority>10</process_priority>

    <!-- Maximum output throughput -->
    <max_eps>50</max_eps>

    <!-- Database synchronization settings -->
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- Active response -->
  <global>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost.localdomain$</white_list>
    <white_list>127.0.0.53</white_list>
  </global>

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
  </command>
  
  <!--
  Comando firewall-drop: bloquea la IP atacante con iptables 
  -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!--
  Active Response: bloqueo automático de IP (Control CIS 17). Activado en el
  Paso 1.9, sobre la regla 100001 (fuerza bruta SSH).

  Por qué solo la 100001: firewall-drop necesita que la alerta traiga la IP
  del atacante (srcip). De las reglas propias eso lo cumplen la 100001
  (fuerza bruta), la 100006 (escaneo de puertos) y la 100004 (puerto 4444).
  Se deja solo la 100001 porque activarlo también en las otras dos bloquearía
  a la máquina atacante durante el escaneo inicial y haría imposible ejecutar
  el resto de los ataques de la Fase 5, que dependen del mismo reverse shell.
  Para FIM (100002), sudo (100003) y cuentas de Windows (100005) no aplica:
  esas alertas no tienen IP de origen y su respuesta es la notificación.

  location local = la acción se ejecuta en el agente que recibió el ataque.
  timeout 600    = el bloqueo se levanta solo a los 10 minutos; requiere
                   <timeout_allowed>yes</timeout_allowed> en el comando.
  -->
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100001</rules_id>
    <timeout>600</timeout>
  </active-response>

  <command>
    <name>host-deny</name>
    <executable>host-deny</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>route-null</name>
    <executable>route-null</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>win_route-null</name>
    <executable>route-null.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>netsh</name>
    <executable>netsh.exe</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <!--
  <active-response>
    active-response options here
  </active-response>
  -->

  <!-- Log analysis -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>netstat -tulpn | sed 's/\([[:alnum:]]\+\)\ \+[[:digit:]]\+\ \+[[:digit:]]\+\ \+\(.*\):\([[:digit:]]*\)\ \+\([0-9\.\:\*]\+\).\+\ \([[:digit:]]*\/[[:alnum:]\-]*\).*/\1 \2 == \3 == \4 \5/' | sort -k 4 -g | sed 's/ == \(.*\) ==/:\1/' | sed 1,2d</command>
    <alias>netstat listening ports</alias>
    <frequency>360</frequency>
  </localfile>

  <localfile>
    <log_format>full_command</log_format>
    <command>last -n 20</command>
    <frequency>360</frequency>
  </localfile>

  <ruleset>
    <!-- Default ruleset -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>

    <!-- User-defined ruleset -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
    <max_sessions>64</max_sessions>
    <session_timeout>15m</session_timeout>
  </rule_test>

  <!-- Configuration for wazuh-authd -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>no</use_password>
    <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES:!CAMELLIA:@STRENGTH</ciphers>
    <!-- <ssl_agent_ca></ssl_agent_ca> -->
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
    <ssl_auto_negotiate>no</ssl_auto_negotiate>
  </auth>

  <cluster>
    <name>wazuh</name>
    <node_name>node01</node_name>
    <node_type>master</node_type>
    <key></key>
    <port>1516</port>
    <bind_addr>0.0.0.0</bind_addr>
    <nodes>
        <node>NODE_IP</node>
    </nodes>
    <hidden>no</hidden>
    <disabled>yes</disabled>
  </cluster>

  <!--
  ===================================================================
  Integraciones (Paso 1.10)
  ===================================================================
  Las credenciales reales NO se versionan: en esta copia del repositorio
  van como marcadores. En el manager se sustituyen por los valores reales,
  y esta copia nunca se sobrescribe desde la VM.
  -->

  <!--
  Notificación a Slack para alertas de nivel 10 o superior, que es el umbral
  de escalado definido en la política de severidad de F1. Se eligió Slack y no
  correo porque el módulo de email de Wazuh no admite usuario y contraseña SMTP:
  con Gmail habría que montar un relay con Postfix.
  alert_format json es obligatorio para el script de integración de Slack.
  -->
  <integration>
    <name>slack</name>
    <hook_url>REEMPLAZAR_HOOK_SLACK</hook_url>
    <level>10</level>
    <alert_format>json</alert_format>
  </integration>

  <!--
  VirusTotal: analiza el hash de los archivos que aparecen o cambian en los
  directorios de riesgo (Control CIS 10, Malware Defenses).

  Se engancha a la regla propia 100014 y NO a <group>syscheck</group>. Con el
  grupo completo, la integracion se disparaba con cada cambio en /etc -rafagas
  de alertas 550 en un sistema en marcha- y agotaba la cuota de la API
  gratuita, que son 4 consultas por minuto: VirusTotal devolvia 429 y el script
  terminaba con ERR_NO_RESPONSE_VT (codigo 4).

  La 100014 acota el analisis a /opt/vt-test y /var/www, que no cambian solos.
  -->
  <integration>
    <name>virustotal</name>
    <api_key>REEMPLAZAR_API_VIRUSTOTAL</api_key>
    <rule_id>100014</rule_id>
    <alert_format>json</alert_format>
  </integration>

</ossec_config>

<ossec_config>
  <!--
  Logcollector: logs locales del manager que Wazuh lee y analiza.
  Los logs de Apache, PostgreSQL y firewall se recolectan en los agentes.
  -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

</ossec_config>
